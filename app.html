<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verbier Ski Level Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #08101f;
      color: #d4dff0;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 56px 20px 40px;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #fff;
      margin-bottom: 14px;
    }

    header p {
      color: #7a8fa8;
      max-width: 480px;
      margin: 0 auto;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    #progress-wrap { margin-bottom: 28px; }

    #progress-bar-bg {
      background: rgba(255,255,255,.08);
      border-radius: 50px;
      height: 6px;
    }

    #progress-bar-fill {
      background: #c9a84c;
      height: 6px;
      border-radius: 50px;
      transition: width .4s ease;
      width: 0%;
    }

    .q-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 16px;
      padding: 36px;
      margin-bottom: 20px;
    }

    .q-card h2 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 24px;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .opt-btn {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: #d4dff0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      padding: 13px 18px;
      text-align: left;
      cursor: pointer;
    }

    .opt-btn:hover { border-color: #c9a84c; background: rgba(201,168,76,.08); }
    .opt-btn.selected { border-color: #c9a84c; background: rgba(201,168,76,.12); color: #e2be72; }

    .nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }

    .btn {
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      padding: 12px 28px;
    }

    .btn-primary { background: #c9a84c; color: #071a3e; }
    .btn-primary:hover { background: #e2be72; }
    .btn-secondary { background: rgba(255,255,255,.07); color: #7a8fa8; }
    .btn:disabled { opacity: .3; cursor: not-allowed; }

    #result-card {
      display: none;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
    }

    #result-card h2 { font-size: 2rem; color: #fff; margin-bottom: 8px; }
    #result-level-name { font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; color: #c9a84c; margin-bottom: 20px; }
    #result-desc { color: #d4dff0; line-height: 1.7; margin-bottom: 28px; max-width: 480px; margin-left: auto; margin-right: auto; }

    .runs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; margin-bottom: 32px; }
    .run-card { border-radius: 10px; padding: 14px; font-size: .88rem; }
    .run-green { background: rgba(46,204,113,.1); border: 1px solid rgba(46,204,113,.3); color: #2ecc71; }
    .run-blue  { background: rgba(52,152,219,.1); border: 1px solid rgba(52,152,219,.3); color: #74b9ff; }
    .run-red   { background: rgba(231,76,60,.1);  border: 1px solid rgba(231,76,60,.3);  color: #e87c70; }
    .run-black { background: rgba(180,180,180,.06); border: 1px solid rgba(200,200,200,.18); color: #ccc; }
    .run-card .run-name { font-weight: 700; display: block; margin-bottom: 3px; }
    .run-card .run-info { font-size: .78rem; opacity: .8; }

    .btn-restart { background: #c9a84c; color: #071a3e; font-weight: 700; border: none; border-radius: 50px; padding: 13px 32px; font-family: 'Space Grotesk', sans-serif; cursor: pointer; }
    .btn-restart:hover { background: #e2be72; }

    .back-link { color: #7a8fa8; text-decoration: none; font-size: .88rem; display: inline-block; margin-top: 16px; }
    .back-link:hover { color: #c9a84c; }

    .top-nav { max-width:680px; margin:0 auto; padding: 18px 20px 0; }
    .top-nav a { color: #7a8fa8; text-decoration: none; font-size: .85rem; }
    .top-nav a:hover { color: #c9a84c; }
  </style>
</head>
<body>

<div class="top-nav">
  <a href="scratch.html">Back to Verbier Page</a>
</div>

<header>
  <h1>Find Your Verbier Level</h1>
  <p>Answer 7 quick questions and discover which runs at Verbier suit you best.</p>
</header>

<div id="app">

  <div id="progress-wrap">
    <div id="progress-bar-bg">
      <div id="progress-bar-fill"></div>
    </div>
  </div>

  <div class="q-card" id="q-card">
    <h2 id="q-text">Loading...</h2>
    <div class="options" id="options"></div>
    <div class="nav-row">
      <button class="btn btn-secondary" id="btn-back" onclick="prevQ()">Back</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQ()">Next</button>
    </div>
  </div>

  <div id="result-card">
    <div style="font-size:3rem; margin-bottom:12px;" id="result-emoji">🎿</div>
    <h2 id="result-title">Your Level</h2>
    <div id="result-level-name">Level</div>
    <p id="result-desc">Description</p>
    <p style="color:#c9a84c; font-weight:700; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;">Recommended Runs at Verbier</p>
    <div class="runs-grid" id="runs-grid"></div>
    <button class="btn-restart" onclick="restart()">Try Again</button>
    <br/>
    <a href="scratch.html" class="back-link">Back to Verbier Page</a>
  </div>

</div>

<script>
  const questions = [
    { text: "How long have you been skiing?", options: [{ label:"Never skied before", points:0 },{ label:"1-3 seasons", points:1 },{ label:"4-8 seasons", points:2 },{ label:"9+ seasons", points:3 }] },
    { text: "How would you describe your usual skiing speed?", options: [{ label:"Slow — snowplough turns", points:0 },{ label:"Moderate — linked parallel turns", points:1 },{ label:"Fast — carving most runs", points:2 },{ label:"Very fast — pushing limits", points:3 }] },
    { text: "How do you handle a steep red run?", options: [{ label:"I'd avoid it entirely", points:0 },{ label:"I'd ski it slowly", points:1 },{ label:"I'd ski it confidently", points:2 },{ label:"Too easy — I want blacks or off-piste", points:3 }] },
    { text: "Have you ever skied off-piste?", options: [{ label:"No, I stick to groomed runs", points:0 },{ label:"A little, on easy mellow slopes", points:1 },{ label:"Yes, I do it regularly", points:2 },{ label:"Yes, including steep terrain", points:3 }] },
    { text: "How are you in moguls?", options: [{ label:"I avoid them completely", points:0 },{ label:"I work through them slowly", points:1 },{ label:"I can handle them reasonably", points:2 },{ label:"I love moguls and seek them out", points:3 }] },
    { text: "How confident are you at altitude (above 3,000m)?", options: [{ label:"I haven't been — I'd be nervous", points:0 },{ label:"Slightly nervous but could manage", points:1 },{ label:"Comfortable — altitude doesn't bother me", points:2 },{ label:"Very comfortable — I love high terrain", points:3 }] },
    { text: "What kind of skiing day appeals to you most?", options: [{ label:"Learning on gentle slopes with an instructor", points:0 },{ label:"Long blue cruisers with friends", points:1 },{ label:"Varied reds and occasional blacks", points:2 },{ label:"Fresh powder off-piste from first lift", points:3 }] },
  ];

  const levels = [
    { min:0, max:5, emoji:"🟢", title:"First-Timer", name:"Beginner", desc:"Every great skier started exactly where you are! Verbier has gentle nursery slopes at La Chaux perfect for your first turns.", runs:[{ name:"La Chaux", info:"Gentle nursery area", cls:"run-green" },{ name:"Savoleyres Greens", info:"Quiet family sector", cls:"run-green" },{ name:"Les Esserts", info:"Beginner magic carpet", cls:"run-green" }] },
    { min:6, max:11, emoji:"🔵", title:"Progressing Skier", name:"Intermediate", desc:"You've got the basics nailed! Verbier's blue runs offer long, flowing descents with stunning views. Focus on smoothing out your parallel turns.", runs:[{ name:"Savoleyres Blues", info:"Long winding blues", cls:"run-blue" },{ name:"Lac des Vaux", info:"Scenic plateau run", cls:"run-blue" },{ name:"La Chaux-Verbier", info:"Classic village run", cls:"run-blue" }] },
    { min:12, max:16, emoji:"🔴", title:"Confident Skier", name:"Advanced Intermediate", desc:"You're skiing with real confidence. Verbier's reds and milder blacks are your playground. Explore the full 4 Vallées and maybe try some easy off-piste.", runs:[{ name:"Lac des Vaux", info:"Fast wide red run", cls:"run-red" },{ name:"Mont-Gelé", info:"Challenging red + off-piste access", cls:"run-red" },{ name:"Nendaz Blacks", info:"Cross into linked valleys", cls:"run-black" }] },
    { min:17, max:21, emoji:"⬛", title:"Expert Skier", name:"Expert", desc:"You are exactly who Verbier was built for. The steep Mont-Fort couloirs, Stairway to Heaven, and the Bec des Rosses are waiting for you.", runs:[{ name:"Mont-Fort Couloirs", info:"Steep blacks from 3,330m", cls:"run-black" },{ name:"Stairway to Heaven", info:"Epic off-piste · Guide required", cls:"run-black" },{ name:"Bec des Rosses", info:"Xtreme Verbier site · Experts only", cls:"run-black" }] },
  ];

  let current = 0;
  let answers = new Array(questions.length).fill(null);

  function render() {
    const q = questions[current];
    document.getElementById('q-text').textContent = q.text;
    const opts = document.getElementById('options');
    opts.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn' + (answers[current] === i ? ' selected' : '');
      btn.textContent = opt.label;
      btn.onclick = () => selectAnswer(i);
      opts.appendChild(btn);
    });
    document.getElementById('btn-back').disabled = current === 0;
    document.getElementById('btn-next').textContent = current === questions.length - 1 ? 'See Results' : 'Next';
    document.getElementById('progress-bar-fill').style.width = Math.round((current / questions.length) * 100) + '%';
  }

  function selectAnswer(i) {
    answers[current] = i;
    document.querySelectorAll('.opt-btn').forEach((b, idx) => b.classList.toggle('selected', idx === i));
  }

  function nextQ() {
    if (answers[current] === null) return;
    if (current < questions.length - 1) { current++; render(); }
    else showResult();
  }

  function prevQ() {
    if (current > 0) { current--; render(); }
  }

  function showResult() {
    let score = 0;
    answers.forEach((ans, qi) => { if (ans !== null) score += questions[qi].options[ans].points; });
    const level = levels.find(l => score >= l.min && score <= l.max) || levels[levels.length - 1];
    document.getElementById('q-card').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('result-emoji').textContent = level.emoji;
    document.getElementById('result-title').textContent = level.title;
    document.getElementById('result-level-name').textContent = level.name;
    document.getElementById('result-desc').textContent = level.desc;
    const grid = document.getElementById('runs-grid');
    grid.innerHTML = '';
    level.runs.forEach(r => {
      grid.innerHTML += '<div class="run-card ' + r.cls + '"><span class="run-name">' + r.name + '</span><span class="run-info">' + r.info + '</span></div>';
    });
  }

  function restart() {
    current = 0;
    answers = new Array(questions.length).fill(null);
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('q-card').style.display = 'block';
    document.getElementById('progress-wrap').style.display = 'block';
    render();
  }

  render();
</script>
</body>
</html>
